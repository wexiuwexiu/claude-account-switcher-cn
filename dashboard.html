<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Account Switcher</title>
<style>
  /* iOS 系统色与灰阶（浅色 / 深色） */
  :root {
    --bg: #f2f2f7; --card: #ffffff; --label: #000000; --label2: rgba(60,60,67,.62); --label3: rgba(60,60,67,.32);
    --sep: rgba(60,60,67,.16); --fill: rgba(120,120,128,.12); --fill-press: rgba(120,120,128,.2);
    --green: #34c759; --orange: #ff9500; --red: #ff3b30; --blue: #007aff;
    --shadow: 0 1px 2px rgba(0,0,0,.03), 0 6px 20px rgba(0,0,0,.04);
    --dim: rgba(0,0,0,.28); --sheet: rgba(249,249,249,.94);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --card: #1c1c1e; --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
            --sep: rgba(84,84,88,.55); --fill: rgba(120,120,128,.24); --fill-press: rgba(120,120,128,.34);
            --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --blue: #0a84ff; --shadow: none;
            --dim: rgba(0,0,0,.5); --sheet: rgba(44,44,46,.96); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; }
  body { background: var(--bg); color: var(--label); -webkit-font-smoothing: antialiased; user-select: none;
         font: 15px/1.4 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
  .num { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #app { padding: 4px 16px 12px; position: relative; }

  /* ---- 大标题 ---- */
  .header { display: flex; align-items: flex-start; gap: 12px; padding: 8px 2px 10px; }
  .title h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
  .title .meta { margin-top: 3px; font-size: 14px; color: var(--label2); }
  .title .meta .on { color: var(--green); font-weight: 600; }
  .tools { margin-left: auto; display: flex; gap: 8px; padding-top: 4px; }
  .ibtn { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--fill); color: var(--label2);
          display: grid; place-items: center; cursor: pointer; transition: background .15s, transform .1s; }
  .ibtn:hover { background: var(--fill-press); color: var(--label); }
  .ibtn:active { transform: scale(.92); }
  .ibtn.on { background: var(--blue); color: #fff; }
  .ibtn svg { width: 15px; height: 15px; }

  /* ---- 顶部提示（状态 / 错误） ---- */
  .toast { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 10px 14px;
           margin-bottom: 12px; font-size: 15px; box-shadow: var(--shadow); }
  .toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; }
  .toast.err i { background: var(--red); }

  /* ---- 分组标题与卡片 ---- */
  .caption { font-size: 14px; color: var(--label2); padding: 0 16px 6px; letter-spacing: .02em; }
  .group { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }

  /* ---- 当前账户：活动圆环 + 两个窗口 ---- */
  .hero { display: grid; grid-template-columns: 124px 1fr; gap: 18px; align-items: center; padding: 16px 20px; }
  .rings { position: relative; width: 124px; height: 124px; }
  .rings svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .rings .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .rings .center b { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
  .rings .center span { font-size: 13px; color: var(--label2); margin-top: 3px; }
  .track { fill: none; opacity: .18; }
  .prog { fill: none; stroke-linecap: round; }
  .intro .prog { animation: draw .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes draw { from { stroke-dashoffset: 100; } }

  .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hmail { font-size: 14px; color: var(--label2); margin: 1px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .name { font-size: 21px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { flex: none; font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .pill.blue { background: var(--blue); color: #fff; }
  .pill.green { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
  .pill.orange { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
  .pill.gray { background: var(--fill); color: var(--label2); }
  .who .fresh { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--label2); flex: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .dot.stale { background: var(--orange); } .dot.err { background: var(--red); }

  .stat + .stat { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--sep); }
  .stat .top { display: flex; align-items: baseline; gap: 8px; }
  .stat .key { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600; }
  .stat .key i { width: 10px; height: 10px; border-radius: 50%; }
  .stat .val { margin-left: auto; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .stat .when { font-size: 14px; color: var(--label2); margin-top: 1px; }
  .stat .when b { color: var(--orange); font-weight: 600; }
  /* 用量速度预测：按本窗口至今的平均速度推算何时用满 */
  .stat .eta { font-size: 14px; margin-top: 2px; color: var(--label2); }
  .stat .eta.warn { color: var(--orange); font-weight: 600; }
  .stat .eta.ok { color: var(--green); }
  .problem { padding: 16px 20px; color: var(--label2); font-size: 14px; }

  /* ---- 其他账户：分组列表 ---- */
  .row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 14px; align-items: center; column-gap: 12px;
         padding: 11px 14px 11px 16px; position: relative; cursor: pointer; transition: background .12s; }
  .row:hover { background: color-mix(in srgb, var(--fill) 50%, transparent); }
  .row:active { background: var(--fill-press); }
  .row.disabled { cursor: default; }
  .row + .row::before { content: ''; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--sep); }
  .row.rec { background: color-mix(in srgb, var(--blue) 7%, transparent); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff;
            font-size: 17px; font-weight: 600; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
  .info { min-width: 0; }
  .info .l1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .info .nm { flex: none; max-width: 45%; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .mail { min-width: 0; font-size: 14px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .l1 .pill { flex: none; }
  .info .l2 { font-size: 14px; color: var(--label2); margin-top: 3px; line-height: 1.45; font-variant-numeric: tabular-nums; }
  .info .l2 b { color: var(--orange); font-weight: 600; }
  .info .l2 .k { display: inline-block; width: 34px; color: var(--label3); }
  .info .why { font-size: 14px; color: var(--blue); margin-top: 3px; }
  .minis { display: flex; gap: 10px; }
  .mini { width: 46px; text-align: center; }
  .mini .ring { position: relative; width: 46px; height: 46px; }
  .mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .mini .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .mini .lab { font-size: 12px; color: var(--label3); margin-top: 2px; }
  .chev { color: var(--label3); }
  .chev svg { width: 8px; height: 13px; display: block; }

  /* ---- 需要注意：只在异常时出现 ---- */
  .alert { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 11px 16px; font-size: 15px; }
  .alert + .alert { border-top: 1px solid var(--sep); }
  .alert .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
  .alert.stale .ic { background: var(--orange); } .alert.err .ic { background: var(--red); }
  .alert .tx { padding-top: 3px; color: var(--label); }
  .alert .tx span { color: var(--label2); }

  .empty { padding: 30px 20px; text-align: center; color: var(--label2); }
  .foot { text-align: center; font-size: 13px; color: var(--label3); margin-top: -8px; }

  /* ---- 切换确认：iOS 操作表 ---- */
  .sheet-wrap { position: absolute; inset: 0; background: var(--dim); display: flex; flex-direction: column; justify-content: flex-end;
                padding: 0 12px 12px; animation: fade .18s ease both; }
  .sheet-wrap.hide { display: none; }
  .sheet { background: var(--sheet); border-radius: 16px; overflow: hidden; backdrop-filter: blur(20px); text-align: center;
           animation: up .26s cubic-bezier(.2,.9,.25,1) both; }
  .sheet .msg { padding: 14px 18px 12px; font-size: 14px; color: var(--label2); border-bottom: 1px solid var(--sep); }
  .sheet .msg b { display: block; font-size: 16px; color: var(--label); margin-bottom: 3px; }
  .sheet button { display: block; width: 100%; border: 0; background: transparent; padding: 15px; font: inherit; font-size: 18px; color: var(--blue); cursor: pointer; }
  .sheet button:active { background: var(--fill-press); }
  .sheet.cancel { margin-top: 8px; animation-delay: .03s; }
  .sheet.cancel button { font-weight: 600; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
</style>
</head>
<body>
<div id="app" class="intro">
  <div class="header">
    <div class="title"><h1>账户</h1><div class="meta" id="meta"></div></div>
    <div class="tools" id="tools"></div>
  </div>
  <div id="toasts"></div>
  <div id="main"></div>
  <div class="foot">点按账户切换 · 悬停查看登录有效期</div>
  <div class="sheet-wrap hide" id="sheet"></div>
</div>

<script>
// 数据来自同目录 api/state，每 15 秒刷新；倒计时每秒只更新文字，不重绘整页（圆环动画只在首次出现）。
// 原生窗口里 WebView2 注入 hideDashboard / pinDashboard / fitDashboard；浏览器里没有这些函数。
const SESSION_MS = 5 * 3600e3, WEEK_MS = 7 * 24 * 3600e3;
// 头像渐变（iOS 联系人风格），按账户在原列表里的位置固定
const AVATAR = [['#5e9cff','#2f6bff'], ['#b18cff','#7a4dff'], ['#ff8fc0','#ff4f93'], ['#ffb066','#ff7a1a'],
                ['#4fdc8a','#14b25e'], ['#5fd8ef','#11a8cc'], ['#ffd25e','#f2a900'], ['#a9b4c4','#738196']];
const NATIVE = typeof window.hideDashboard === 'function';
const PROBLEM_ZH = {
  'web sign-in only; usage shows after Pro + one use of the Code tab': '仅网页登录：开通 Pro 并在 Code 标签页用一次后显示用量',
  'signed out, add it again': '登录已失效，请重新添加',
};
const ICON = {
  pin: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9.5 2.5l4 4-2 1-2.5 2.5.5 3-1 1-3-3-3 3M5 8.5l2.5-2.5 1-2z" stroke-linejoin="round"/></svg>',
  close: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke-linecap="round"/></svg>',
  refresh: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.5h-2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: '<svg viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2"><path d="M1.5 1.5l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
let state = null, offset = 0;   // offset: 服务器时间 - 本地时间，避免本机时钟偏差
let confirming = null, pinned = false, error = '';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const now = () => Date.now() + offset;

// 用量颜色：像 Apple 活动圆环一样每个窗口有自己的色相（5 小时绿、本周蓝），
// 接近用满时统一变橙（≥ 预警线）、变红（≥ 阈值）。
function tone(pct, base) {
  if (pct >= state.threshold) return 'var(--red)';
  if (pct >= state.warnAt) return 'var(--orange)';
  return base === 'week' ? 'var(--blue)' : 'var(--green)';
}

// 时间始终带周几："今天 周六 23:40"、"明天 周日 02:10"、"周二 17:59"、"11-07 周六 03:00"
function absTime(d) {
  const n = new Date(now()), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const wd = '周' + '日一二三四五六'[d.getDay()];
  const days = Math.round((new Date(d).setHours(0,0,0,0) - new Date(n).setHours(0,0,0,0)) / 864e5);
  if (days === 0) return `今天 ${wd} ${hm}`;
  if (days === 1) return `明天 ${wd} ${hm}`;
  if (days < 7) return `${wd} ${hm}`;
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${wd} ${hm}`;
}

function countdown(ms) {
  if (ms <= 0) return '即将重置';
  const m = Math.ceil(ms / 60e3), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  if (d > 0) return `${d} 天 ${h} 小时`;
  if (h > 0) return `${h} 小时 ${mm} 分`;
  return `${mm} 分钟`;
}
// 倒计时占位：tick() 每秒按 data-until 刷新文字
const cd = iso => `<span data-until="${iso}">${countdown(new Date(iso) - now())}</span>`;

// 圆环：pathLength=100，dashoffset 表示未用部分；同色淡轨道
function ring(r, width, pct, color) {
  const p = Math.max(0, Math.min(100, pct));
  return `<circle class="track" cx="50" cy="50" r="${r}" stroke="${color}" stroke-width="${width}"/>
    <circle class="prog" cx="50" cy="50" r="${r}" stroke="${color}" stroke-width="${width}" pathLength="100"
      stroke-dasharray="100" stroke-dashoffset="${100 - p}" style="${p === 0 ? 'opacity:0' : ''}"/>`;
}

// 账户能否立刻使用：任一窗口达到阈值就要等它重置（取较晚的那个）
function availability(a) {
  if (a.problem) return {pill: 'gray', text: a.pending ? '仅网页登录' : '需处理', rank: 3, until: Infinity};
  if (!a.session) return {pill: 'gray', text: '用量未知', rank: 2, until: Infinity};
  const blocked = [a.session, a.weekly].filter(w => w && w.pct >= state.threshold);
  if (!blocked.length) return {pill: 'green', text: '可用', rank: 0, until: 0, peak: Math.max(a.session.pct, a.weekly ? a.weekly.pct : 0)};
  const until = Math.max(...blocked.map(w => w.reset ? new Date(w.reset).getTime() : Infinity));
  return {pill: 'orange', text: '已用满', rank: 1, until};
}

// 推荐切到哪个号（当前账户用到一半以上才给）：
// 1) 周额度 2 天内重置、还剩 20% 以上没用的号，先用掉，否则作废；取最早重置的。
// 2) 否则取 5h 剩余最多的；差不多时（15% 以内）选 5h 窗口最先重置的。周用量接近阈值的号不参与第 2 条。
function recommend(active, list) {
  const cur = active && active.session;
  const busy = !active || !cur || cur.pct >= 50 || (active.weekly && active.weekly.pct >= state.threshold);
  if (!busy) return null;
  const ok = list.filter(a => availability(a).rank === 0);
  if (!ok.length) return null;
  const t = now(), weekLeft = a => a.weekly && a.weekly.reset ? new Date(a.weekly.reset) - t : Infinity;
  const expiring = ok.filter(a => weekLeft(a) < 2 * 864e5 && 100 - a.weekly.pct >= 20).sort((x, y) => weekLeft(x) - weekLeft(y));
  if (expiring.length) {
    const a = expiring[0];
    return {uuid: a.uuid, why: `周额度 ${countdown(weekLeft(a))}后重置，还剩 ${Math.round(100 - a.weekly.pct)}% 没用，先用掉`};
  }
  const roomy = ok.filter(a => !a.weekly || a.weekly.pct < state.threshold - 10);
  const pool = roomy.length ? roomy : ok;
  const room = a => 100 - a.session.pct, resetIn = a => a.session.reset ? new Date(a.session.reset) - t : SESSION_MS;
  const best = Math.max(...pool.map(room));
  const a = pool.filter(x => room(x) >= best - 15).sort((x, y) => resetIn(x) - resetIn(y))[0];
  return {uuid: a.uuid, why: `5 小时额度还剩 ${Math.round(room(a))}%` + (a.session.reset ? `，${absTime(new Date(a.session.reset))} 就会重置` : '')};
}

// 数据新旧：绿=新，橙=过期，红=查询失败
function freshDot(a) {
  const ago = a.checkedAt ? Math.max(0, Math.floor((now() - new Date(a.checkedAt)) / 60e3)) : null;
  const stale = ago === null || ago * 60 > a.staleAfter;
  return {cls: a.error ? 'err' : stale ? 'stale' : '', stale,
          text: ago === null ? '未更新' : ago < 1 ? '刚刚' : ago < 60 ? `${ago} 分钟前` : `${Math.floor(ago / 60)} 小时前`};
}

function tokenInfo(a) {
  if (!a.loginExpires) return null;
  const at = new Date(a.loginExpires), left = at - now();
  return {date: `${pad(at.getMonth() + 1)}-${pad(at.getDate())}`, left, days: Math.floor(left / 864e5)};
}

// 悬停提示：邮箱、套餐、登录 token、数据更新时间
function hoverText(a, plan) {
  const t = tokenInfo(a);
  return [a.email, plan && '套餐 ' + plan, t && `登录 token 至 ${t.date}`, '数据 ' + freshDot(a).text].filter(Boolean).join('\n');
}

// 只在出问题时出现：查询失败、数据过期、token 将到期 / 已到期
function alertsFor(a, name) {
  const out = [], t = tokenInfo(a), f = freshDot(a);
  if (a.error) out.push(['err', name, `查询失败（${a.error}）`]);
  else if (f.stale && a.checkedAt && !a.problem) out.push(['stale', name, `用量数据 ${f.text}，可能已过期`]);
  if (t && t.left <= 0) out.push(['err', name, `登录 token 已于 ${t.date} 到期，尽快切过去让 Claude 续期`]);
  else if (t && t.days < 7) out.push(['stale', name, `登录 token ${t.days} 天后到期，近期切过去用一下即可续期`]);
  return out;
}

function splitLabel(label) {
  const m = /^(.*) \((\w+)\)$/.exec(label);
  return m ? [m[1], m[2]] : [label, ''];
}

function avatar(a, name) {
  const [c1, c2] = AVATAR[state.accounts.indexOf(a) % AVATAR.length];
  return `<span class="avatar" style="background:linear-gradient(160deg,${c1},${c2})">${esc((name || '?').slice(0, 1).toUpperCase())}</span>`;
}

// 5 小时窗口的速度预测：按窗口开始至今的平均速度，推算何时用满。
// 窗口刚开始（< 15 分钟）或用量很低时样本太少，不预测。
function forecast(w) {
  if (!w || !w.reset || w.pct >= state.threshold) return '';
  const left = new Date(w.reset) - now(), elapsed = SESSION_MS - left;
  if (elapsed < 15 * 60e3 || w.pct < 5) return '';
  const rate = w.pct / elapsed;                       // 每毫秒的百分比
  const toFull = (state.threshold - w.pct) / rate;    // 到阈值还需多久
  if (toFull >= left) return `<div class="eta ok">按目前速度，重置前用不完</div>`;
  // 一定在 5 小时内，只写时分；提前量用短格式，保证一行放得下
  const at = new Date(now() + toFull), early = Math.round((left - toFull) / 60e3);
  const hm = pad(at.getHours()) + ':' + pad(at.getMinutes());
  const short = early >= 60 ? `${Math.floor(early / 60)} 时 ${early % 60} 分` : `${early} 分`;
  return `<div class="eta warn">按目前速度约 ${hm} 用满，比重置早 ${short}</div>`;
}

// 账户套餐是否不全一样：一样就不在每行重复显示
const mixedPlans = () => new Set(state.accounts.map(a => splitLabel(a.label)[1])).size > 1;

// 某个窗口的重置描述：被用满时写"恢复"并标橙
function whenText(w, withCountdown) {
  if (!w) return '';
  if (!w.reset) return '窗口未开始';
  const t = absTime(new Date(w.reset)), full = w.pct >= state.threshold;
  const main = full ? `<b>${t} 恢复</b>` : `${t} 重置`;
  return withCountdown ? `${main} · 还剩 ${cd(w.reset)}` : main;
}

function heroCard(a) {
  const [name, plan] = splitLabel(a.label), f = freshDot(a);
  const head = `<div class="who"><span class="name">${esc(name)}</span><span class="pill blue">当前</span>
    ${plan ? `<span class="pill gray">${esc(plan)}</span>` : ''}<span class="fresh"><span class="dot ${f.cls}"></span>${f.text}</span></div>
    <div class="hmail">${esc(a.email || '')}</div>`;
  if (a.problem || !a.session) {
    return `<div class="group" title="${esc(hoverText(a, plan))}"><div class="problem">${head}${esc(a.problem ? (PROBLEM_ZH[a.problem] || a.problem) : '用量未知')}</div></div>`;
  }
  const s = a.session, w = a.weekly || {pct: 0};
  const cs = tone(s.pct, 'session'), cw = tone(w.pct, 'week');
  const stat = (key, color, win, extra) => `<div class="stat"><div class="top"><span class="key"><i style="background:${color}"></i>${key}</span>
      <span class="val num">${Math.round(win.pct)}%</span></div><div class="when">${whenText(win, true)}</div>${extra || ''}</div>`;
  return `<div class="group" title="${esc(hoverText(a, plan))}"><div class="hero">
    <div class="rings"><svg viewBox="0 0 100 100">${ring(43, 11, s.pct, cs)}${ring(29.5, 11, w.pct, cw)}</svg>
      <div class="center"><b class="num">${Math.round(s.pct)}%</b><span>5 小时</span></div></div>
    <div>${head}${stat('5 小时', cs, s, forecast(s))}${a.weekly ? stat('本周', cw, a.weekly) : ''}</div></div></div>`;
}

function miniRing(label, w, base) {
  if (!w) return '';
  const c = tone(w.pct, base);
  return `<div class="mini"><div class="ring"><svg viewBox="0 0 100 100">${ring(40, 14, w.pct, c)}</svg>
    <span class="pct num">${Math.round(w.pct)}</span></div><div class="lab">${label}</div></div>`;
}

function accRow(a, rec) {
  const [name, plan] = splitLabel(a.label), av = availability(a), isRec = rec && rec.uuid === a.uuid;
  const can = !state.busy;
  const pill = isRec ? '<span class="pill blue">推荐</span>' : `<span class="pill ${av.pill}">${av.text}</span>`;
  let l2;
  if (a.problem) l2 = esc(PROBLEM_ZH[a.problem] || a.problem);
  else if (!a.session) l2 = '用量未知';
  else l2 = `<span class="k">5 时</span>${whenText(a.session)}<br><span class="k">本周</span>${whenText(a.weekly)}`;
  return `<div class="row${isRec ? ' rec' : ''}${can ? '' : ' disabled'}" data-uuid="${esc(a.uuid)}" title="${esc(hoverText(a, plan))}">
    ${avatar(a, name)}
    <div class="info"><div class="l1"><span class="nm">${esc(name)}</span>${pill}${mixedPlans() && plan ? `<span class="pill gray">${esc(plan)}</span>` : ''}<span class="mail">${esc(a.email || '')}</span></div>
      <div class="l2">${l2}</div>${isRec ? `<div class="why">${esc(rec.why)}</div>` : ''}</div>
    <div class="minis">${miniRing('5 时', a.session, 'session')}${miniRing('本周', a.weekly, 'week')}</div>
    <span class="chev">${ICON.chev}</span></div>`;
}

function renderTools() {
  const t = [];
  if (NATIVE) t.push(`<button class="ibtn${pinned ? ' on' : ''}" data-act="pin" title="${pinned ? '取消固定' : '固定：点到别处不自动隐藏'}">${ICON.pin}</button>`);
  t.push(`<button class="ibtn" data-act="refresh" title="刷新">${ICON.refresh}</button>`);
  if (NATIVE) t.push(`<button class="ibtn" data-act="close" title="关闭 (Esc)">${ICON.close}</button>`);
  document.getElementById('tools').innerHTML = t.join('');
}

function renderSheet() {
  const el = document.getElementById('sheet');
  const a = state && state.accounts.find(x => x.uuid === confirming);
  if (!a || state.busy) { el.className = 'sheet-wrap hide'; el.innerHTML = ''; return; }
  const [name] = splitLabel(a.label);
  el.className = 'sheet-wrap';
  el.innerHTML = `<div class="sheet"><div class="msg"><b>切换到 ${esc(name)}？</b>Claude 会重启，正在生成的回复会中断</div>
    <button data-act="switch">切换</button></div><div class="sheet cancel"><button data-act="cancel">取消</button></div>`;
}

function render() {
  if (!state) return;
  document.getElementById('meta').innerHTML =
    `阈值 ${state.threshold}% · 自动切换 <span class="${state.autoSwitch ? 'on' : ''}">${state.autoSwitch ? '开' : '关'}</span> · 更新于 ` +
    new Date(state.now).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const toasts = [state.status, state.note].filter(Boolean).map(t => `<div class="toast"><i></i>${esc(t)}</div>`);
  if (state.busy) toasts.push('<div class="toast"><i></i>正在切换，Claude 会自动重启…</div>');
  if (error) toasts.push(`<div class="toast err"><i></i>${esc(error)}</div>`);
  document.getElementById('toasts').innerHTML = toasts.join('');

  const main = document.getElementById('main');
  if (!state.accounts.length) {
    main.innerHTML = '<div class="group"><div class="empty">还没有账户，请先在 Claude 中登录</div></div>';
    renderSheet(); fit(); return;
  }
  const active = state.accounts.find(a => a.active);
  // 其他账户：可用的在前（用得少的更前），再按恢复时间，最后是无法使用的；推荐的排第一
  const others = state.accounts.filter(a => a !== active).map(a => ({a, av: availability(a)}))
    .sort((x, y) => x.av.rank - y.av.rank || (x.av.rank === 0 ? x.av.peak - y.av.peak : x.av.until - y.av.until)).map(x => x.a);
  const rec = recommend(active, others);
  if (rec) others.sort((x, y) => (y.uuid === rec.uuid) - (x.uuid === rec.uuid));
  const alerts = state.accounts.flatMap(a => alertsFor(a, splitLabel(a.label)[0]));

  let html = '';
  if (active) html += `<div class="caption">当前账户</div>${heroCard(active)}`;
  if (others.length) html += `<div class="caption">${active ? '切换到' : '账户'}</div><div class="group">${others.map(a => accRow(a, rec)).join('')}</div>`;
  if (alerts.length) html += `<div class="caption">需要注意</div><div class="group">${alerts.map(([cls, n, t]) =>
    `<div class="alert ${cls}"><span class="ic">!</span><div class="tx">${esc(n)}<br><span>${esc(t)}</span></div></div>`).join('')}</div>`;
  main.innerHTML = html;
  renderSheet();
  fit();
}

// 每秒只刷新倒计时文字
function tick() {
  document.querySelectorAll('[data-until]').forEach(el => { el.textContent = countdown(new Date(el.dataset.until) - now()); });
}

// 原生窗口按内容高度自适应
let lastH = 0;
function fit() {
  if (typeof window.fitDashboard !== 'function') return;
  const h = Math.ceil(document.getElementById('app').getBoundingClientRect().height);
  if (h !== lastH) { lastH = h; window.fitDashboard(h); }
}

async function load() {
  try {
    const r = await fetch('api/state', {cache: 'no-store'});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    offset = new Date(state.now) - Date.now();
    if (error.startsWith('连接失败')) error = '';
  } catch (e) {
    error = '连接失败，switcher 可能已退出';
  }
  render();
  // 圆环绘制动画只在第一次出现时播放
  setTimeout(() => document.getElementById('app').classList.remove('intro'), 1000);
}

async function doSwitch(uuid) {
  confirming = null;
  renderSheet();
  const r = await fetch('api/switch', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({uuid})});
  error = r.ok ? '' : '切换失败：' + (await r.text());
  load();
}

document.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') return window.hideDashboard();
  if (act === 'pin') { pinned = !pinned; window.pinDashboard(pinned); renderTools(); return; }
  if (act === 'refresh') return load();
  if (act === 'switch' && confirming) return doSwitch(confirming);
  if (act === 'cancel' || e.target.id === 'sheet') { confirming = null; return renderSheet(); }
  const row = e.target.closest('.row:not(.disabled)');
  if (row) { confirming = row.dataset.uuid; renderSheet(); }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (confirming) { confirming = null; renderSheet(); }
  else if (NATIVE) window.hideDashboard();
});

renderTools();
// 字体加载完或窗口尺寸变化后重新量一次高度，避免首次测量偏差
document.fonts && document.fonts.ready.then(fit);
window.addEventListener('resize', fit);
load();
setInterval(load, 15000);
setInterval(tick, 1000);
</script>
</body>
</html>
